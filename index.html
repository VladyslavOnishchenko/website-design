<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Shadient.co</title>
    <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body class="body">
<div class="wrapper">
    <header class="header">
        <div class="container header__container">
            <div class="header__wrapper">
                <a href="/" class="header__logo">
                    <img src="assets/images/header/header-logo.png" alt="Shadient.co">
                </a>

                <div class="header__menu">
                    <nav class="header__nav">
                        <ul class="header__list">
                            <li class="header__list-item"><a href="/" class="header__link">Company</a></li>
                            <li class="header__list-item"><a href="/" class="header__link">Services</a></li>
                            <li class="header__list-item"><a href="/" class="header__link">Resources</a></li>
                        </ul>
                    </nav>
                    <button class="button button--secondary header__button">Contact</button>
                    <span class="header__counter"></span>
                </div>
                <button class="header__burger" aria-label="Menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>
    <section class="hero">
        <div class="container hero__container">
            <div class="hero__wrapper">
                <h1 class="hero__title">
                    Attract <span class="hero__title-accent">NewLeads</span> like never before
                </h1>
                <p class="hero__description">
                    Risus commodo id odio turpis pharetra elementum. Pulvinar porta porta feugiat scelerisque in elit. Morbi rhoncus, tellus, eros
                </p>
                <form class="hero__form">
                    <input class="hero__input" type="email" placeholder="Email">
                    <button class="button">ATTRACT</button>
                </form>
            </div>
        </div>
    </section>
</div>
<script src="assets/js/burger.js"></script>
<script src="assets/js/counter.js"></script>
<script src="assets/js/function.js"></script>
</body>
</html>
